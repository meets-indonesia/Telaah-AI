version: '3.8'

services:
  telaah-qdrant:
    image: qdrant/qdrant:latest
    container_name: telaah-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant_storage:/qdrant/storage

  telaah-redis:
    image: redis:alpine
    container_name: telaah-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis_storage:/data
